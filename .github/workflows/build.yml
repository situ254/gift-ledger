name: Build and Push Image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend and prepare public
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          rm -rf backend/public
          mkdir -p backend/public
          cp -r frontend/dist/* backend/public/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 用仓库 secret GHCR_PAT（classic PAT，需 write:packages）。
          # 注意：内置 GITHUB_TOKEN 即使声明了 packages: write，推这个包仍会报
          # permission_denied: write_package（包的所有权绑在账号 PAT 上）。
          # classic PAT 默认 90 天过期，过期后此步会报 denied: denied，
          # 届时重新生成 token 并更新本仓库 secret GHCR_PAT 即可。
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.optimized
          push: true
          tags: ghcr.io/situ254/gift-ledger:latest
