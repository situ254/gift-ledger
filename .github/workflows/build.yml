name: Build and Push Image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend and prepare public
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          rm -rf backend/public
          mkdir -p backend/public
          cp -r frontend/dist/* backend/public/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 用 Actions 内置 token：只要上面的 permissions.packages=write 就够，
          # 且不会像手动 PAT 那样 90 天过期（GHCR_PAT 已于 2026-10 失效，
          # 导致 push 后镜像构建 job 在 Login 步骤报 denied: denied）
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.optimized
          push: true
          tags: ghcr.io/situ254/gift-ledger:latest
